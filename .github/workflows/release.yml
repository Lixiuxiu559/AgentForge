name: Release

# tag 推送时创建 GitHub Release，正文取自 CHANGELOG 对应段落。
#
# **这件事和 npm 无关。** 之前的实现把创建 Release 塞在 publish.yml 里，结果
# npm 一停用、publish.yml 一改成手动触发，Release 就再也不会产生了——
# 而 git tag 照旧在打，于是「有 tag 但看不到 Release」。
#
# GitHub 上 tag 与 Release 是两个对象：推 tag 不会自动生成 Release，
# 必须显式 create。这个工作流负责那一步，不依赖任何分发渠道。
#
# 留着 Release 的实际用处：版本页可读、CHANGELOG 有图形入口，
# 以及将来若要用 awesome-dsh-plugin 的 `tarball:` 字段，附件挂在这里。

on:
  push:
    tags:
      - 'v*'

# 只读代码 + 建 Release。
permissions:
  contents: write

# 同一个 tag 只跑一个；已开始的不取消。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # 第三方 action 钉 commit SHA，尾注版本号供 Dependabot 识别（见 .github/dependabot.yml）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: 校验发布版本
        run: |
          node tools/doctor.mjs
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          # Release 已存在时保留已有内容，支持安全重跑。
          if ! gh release view "$tag" >/dev/null 2>&1; then
            node tools/changelog-section.mjs "$version" > /tmp/release-notes.md
            gh release create "$tag" --title "$tag" --notes-file /tmp/release-notes.md
          fi
