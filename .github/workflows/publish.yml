name: Publish to npm

# ⛔ 当前已停用（2026-09-26）。
#
# 决定先不发 npm —— 没有下载量可以接受。但工作流若继续监听 tag，每次
# `release.mjs --push` 推 tag 都会触发它并**必然失败**（可信发布者没配、
# 包名也不属于本账号），等于每次发版挂一个红叉。
#
# 所以把触发方式从「tag 推送」改成「仅手动」，这样 tag 不再触发它，
# 而文件本身保留下来——将来要发 npm 时，把下面的 `on:` 改回：
#
#   on:
#     push:
#       tags:
#         - 'v*'
#
# 并把 docs/npm-publishing.md 里的前置条件（首次引导 + 配置可信发布者）走完。
#
# 认证走 npm Trusted Publishing（OIDC）：不需要 NPM_TOKEN，每次发布用 GitHub 的
# id-token 换一个短时效凭据，并自动附带 provenance 证明。
#
# ⚠️ 启用前必须满足两个条件，缺一不可：
#
#   1. npmjs.com 上该包已配置「可信发布者」，指向
#        仓库 Lixiuxiu559/AgentForge + 工作流 publish.yml
#      配置入口：包的 Settings 页 → Trusted Publisher。
#
#   2. **OIDC 无法发布包的第一个版本** —— 可信发布者配置挂在包自己的设置页上，
#      包必须先存在。所以首次发布要一次性引导，见 docs/npm-publishing.md。
#
# 另注：npm 现在默认「暂存发布」，直接发布要显式开启。见 docs/npm-publishing.md。

on:
  workflow_dispatch:

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # OIDC 可信发布必需

# 同一个 tag 只允许一个发布在跑。发布不可逆，并发没有意义且危险；
# cancel-in-progress 保持 false——已经开始的发布不该被后来的取消掉。
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # 第三方 action 一律钉 commit SHA，不用可移动的 tag。
      # 尾注的版本号只是给人看的，Dependabot 会据此提更新 PR（见 .github/dependabot.yml）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: 升级 npm（OIDC 可信发布需要 >= 11.5.1）
        run: npm install -g npm@latest

      - name: tag 与 package.json 版本必须一致
        # release.mjs 会同步 bump 两端清单再打标签，所以正常情况下必然一致。
        # 不一致说明标签是手工打的、或有人改了版本号没走发版脚本——这种时候
        # 发出去就是一个版本号和 tag 对不上的包，且 npm 不可逆，宁可中止。
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag = v$tag / package.json = $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag 与 package.json 的 $pkg 不一致，拒绝发布。用 node tools/release.mjs <bump> --push 发版。"
            exit 1
          fi

      - name: 结构与资产校验
        # npm 的 files 白名单漏掉 skills/agents 时，装出来的包会「装载成功但什么都没注册」，
        # 这是本项目最隐蔽的失败模式，所以发布前必须过一遍 doctor。
        run: node tools/doctor.mjs

      - name: 确认包内容（不发布）
        run: npm pack --dry-run

      - name: 该版本是否已发布
        # 幂等：重跑工作流、或 tag 被重新推送时，不要撞上「版本已存在」而红掉。
        # 已发布就跳过发布步骤，后面的 Release 创建仍然会跑。
        id: published
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "::notice::${name}@${version} 已存在于 npm，跳过发布"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "${name}@${version} 尚未发布"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布
        if: steps.published.outputs.skip != 'true'
        # publishConfig.access=public 已在 package.json 里声明，无需 --access。
        # provenance 由可信发布自动附带，无需 --provenance。
        run: npm publish

      - name: 创建 GitHub Release
        # 正文取自 CHANGELOG 对应段落，让 Release 页和 CHANGELOG 不会各说各话。
        # 独立于上面的 skip 判断：即使包早就发过了，这个 tag 也该有自己的 Release。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME 已存在，跳过"
            exit 0
          fi
          node tools/changelog-section.mjs "$version" > /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md
