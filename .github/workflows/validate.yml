name: validate

# 只做校验，不发版。
# 发版是显式动作：bump .claude-plugin/plugin.json 的 version 并打标签。
# 详见 docs/releasing.md

on:
  push:
    # dev 也要跑：日常开发在 dev 上，若只监听 main，写坏了要等到开 PR
    # 那一刻才发现。分支策略见 docs/releasing.md。
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 测当前仍受支持的两条 LTS 线（v22 维护期 / v24 活跃期）。
        # 原先只测 Node 20 —— 它已于 2026-04-30 EOL，EOL 的运行时不该再当验证目标。
        # 本项目零依赖，跑一遍只要十几秒，所以测两条线的成本可以忽略。
        node: ['22', '24']
    steps:
      # 第三方 action 钉 commit SHA，尾注版本号供 Dependabot 识别（见 .github/dependabot.yml）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: 结构与资产校验
        run: node tools/doctor.mjs

      - name: JSON 清单合法性
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"

      - name: 脚本语法
        run: |
          node --check tools/doctor.mjs
          node --check tools/release.mjs
          node --check tools/changelog-section.mjs
          node --check src/index.js
          node --check skills/complexity-audit/scripts/crap.js

      - name: CHANGELOG 段落提取可用
        # publish.yml 用它生成 Release 正文；这里提前验，免得发布当天才发现抽不出来。
        run: |
          V=$(node -e "console.log(require('./.claude-plugin/plugin.json').version)")
          if node tools/changelog-section.mjs "$V" >/dev/null 2>&1; then
            echo "✅ CHANGELOG 有 [$V] 段落"
          else
            echo "::error::CHANGELOG.md 缺少 [$V] 段落，发布时无法生成 Release 正文"
            exit 1
          fi

      - name: 版本号与 CHANGELOG 一致性
        run: |
          V=$(node -e "console.log(require('./.claude-plugin/plugin.json').version)")
          echo "plugin.json version = $V"
          if [ -n "$(git tag -l "v$V")" ]; then
            echo "✅ 该版本已打标签（已发布）"
          else
            echo "ℹ️  该版本尚未打标签（未发布，属正常：日常 push 不发版）"
          fi
