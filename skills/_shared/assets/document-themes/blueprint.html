<!doctype html>
<html lang="{{DOCUMENT_LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{DOCUMENT_TITLE}}</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: #172b41;
      background: #e9eff5;
      font-synthesis: none;
      --bg: #e9eff5;
      --surface: #ffffff;
      --surface-2: #f4f7fb;
      --ink: #172b41;
      --muted: #5b6c7f;
      --faint: #8291a2;
      --accent: #246bfd;
      --accent-strong: #174eb8;
      --accent-soft: #e8f0ff;
      --line: #d6e0ea;
      --line-strong: #b7c7d8;
      --success: #14755d;
      --success-soft: #e4f4ee;
      --warning: #a46212;
      --warning-soft: #fff2db;
      --nav-bg: #102a43;
      --nav-fg: #f2f7fc;
      --nav-muted: #9fb4c8;
      --nav-active-bg: #1d466b;
      --nav-active-fg: #ffffff;
      --hero-bg: #f0f5fc;
      --hero-border: #cbdbea;
      --table-head: #edf3f9;
      --code-bg: #102a43;
      --code-fg: #e8f2ff;
      --radius: 8px;
      --radius-lg: 12px;
      --shadow: 0 18px 54px rgb(16 42 67 / 12%);
      --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --content-width: 1600px;
      --sidebar-width: 240px;
      --section-space: 50px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 24px; }
    body { margin: 0; color: var(--ink); background: var(--bg); }
    a { color: inherit; }
    a:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .document-page { min-height: 100vh; padding: 32px 24px; }
    .doc-window {
      width: 94%;
      max-width: var(--content-width);
      margin: 0 auto;
      /* 保留圆角裁剪，但不创建会拦截侧栏 sticky 的滚动容器。 */
      overflow: clip;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .doc-layout { display: grid; grid-template-columns: var(--sidebar-width) minmax(0, 1fr); min-height: calc(100vh - 66px); background: var(--nav-bg); }
    .doc-sidebar {
      position: sticky;
      top: 16px;
      align-self: start;
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
      scrollbar-width: none;
      display: flex;
      flex-direction: column;
      padding: 34px 22px 26px;
      border-right: 1px solid var(--line);
      color: var(--nav-fg);
      background: var(--nav-bg);
    }
    .doc-sidebar::-webkit-scrollbar { display: none; }
    .doc-brand { display: flex; align-items: center; gap: 11px; text-decoration: none; }
    .doc-brand-mark {
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid #3b6690;
      border-radius: var(--radius);
      color: #ffffff;
      background: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .doc-brand-name { display: block; font-size: 15px; font-weight: 750; letter-spacing: -.01em; }
    .doc-brand-meta { display: block; margin-top: 3px; color: var(--nav-muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
    .doc-nav-label { margin: 40px 10px 10px; color: var(--nav-muted); font-size: 11px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
    .doc-nav { display: grid; gap: 4px; }
    .doc-nav a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: var(--radius);
      color: var(--nav-muted);
      font-size: 14px;
      text-decoration: none;
    }
    .doc-nav a span { color: var(--nav-muted); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; opacity: .75; }
    .doc-nav a:hover, .doc-nav a.active { color: var(--nav-active-fg); background: var(--nav-active-bg); }
    .doc-sidebar-footer { margin-top: auto; padding: 24px 10px 0; border-top: 1px solid #2b4966; color: var(--nav-muted); font-size: 12px; line-height: 1.7; }
    .doc-content { min-width: 0; padding: 42px clamp(28px, 4.6vw, 64px) 46px; background: var(--surface); }
    .doc-hero {
      margin-bottom: 28px;
      padding: 30px;
      border: 1px solid var(--hero-border);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius-lg);
      background: var(--hero-bg);
    }
    .doc-eyebrow { margin: 0 0 14px; color: var(--accent); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .doc-hero h1 {
      max-width: 760px;
      margin: 0;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: clamp(34px, 4vw, 48px);
      font-weight: 750;
      line-height: 1.16;
      letter-spacing: -.045em;
    }
    .doc-subtitle { max-width: 680px; margin: 15px 0 0; color: var(--muted); font-size: 16px; line-height: 1.8; }
    .doc-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 22px; }
    .doc-meta:empty { display: none; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border: 1px solid var(--line); border-radius: var(--radius); color: var(--muted); background: var(--surface); font-size: 12px; font-weight: 650; line-height: 1.4; }
    .badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }
    .badge.accent { color: var(--accent-strong); border-color: var(--accent); background: var(--accent-soft); }
    .badge.accent::before { background: var(--accent); }
    .badge.success { color: var(--success); border-color: transparent; background: var(--success-soft); }
    .badge.success::before { background: var(--success); }
    .badge.warning { color: var(--warning); border-color: transparent; background: var(--warning-soft); }
    .badge.warning::before { background: var(--warning); }
    .summary-strip { display: grid; grid-template-columns: repeat(3, 1fr); margin-bottom: 24px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
    .summary-item { padding: 17px 20px; border-right: 1px solid var(--line); }
    .summary-item:last-child { border-right: 0; }
    .summary-item span { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12px; }
    .summary-item strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 19px; font-weight: 700; }
    .notice { display: grid; grid-template-columns: auto 1fr; gap: 12px; margin-bottom: 30px; padding: 14px 16px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--radius); background: var(--surface-2); }
    .notice.warning { border-left-color: var(--warning); background: var(--warning-soft); }
    .notice.success { border-left-color: var(--success); background: var(--success-soft); }
    .notice.after-code { margin-top: 16px; margin-bottom: 0; }
    .notice-marker { color: var(--accent); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; font-weight: 800; }
    .notice.warning .notice-marker { color: var(--warning); }
    .notice.success .notice-marker { color: var(--success); }
    .notice strong { display: block; margin-bottom: 3px; font-size: 14px; }
    .notice p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .doc-section { margin-top: var(--section-space); scroll-margin-top: 24px; }
    .section-heading { display: flex; align-items: center; gap: 13px; margin-bottom: 20px; }
    .section-index { color: var(--accent); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 20px; font-weight: 650; line-height: 1; }
    .section-kicker { margin: 0 0 3px; color: var(--faint); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    .section-heading h2 { margin: 0; font-family: var(--font-display); font-size: 23px; line-height: 1.25; letter-spacing: -.025em; }
    .section-intro { margin: -5px 0 20px; color: var(--muted); font-size: 14px; line-height: 1.8; }
    .two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .three-col { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .info-card { padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: 0 3px 9px rgb(16 42 67 / 4%); }
    .info-card.soft { background: var(--surface-2); }
    .info-card h3 { margin: 0 0 12px; font-size: 15px; line-height: 1.4; }
    .info-card h3 .card-no { margin-right: 7px; color: var(--accent); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
    .info-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.8; }
    .styled-list { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .styled-list li { position: relative; padding-left: 16px; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .styled-list li::before { content: ""; position: absolute; top: .7em; left: 0; width: 7px; height: 2px; background: var(--accent); }
    .styled-list strong { color: var(--ink); font-weight: 650; }
    .table-wrap { max-width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
    table { width: 100%; min-width: 610px; border-collapse: collapse; font-size: 13px; line-height: 1.65; text-align: left; }
    caption { text-align: left; }
    th { padding: 11px 14px; color: var(--muted); background: var(--table-head); font-size: 11px; font-weight: 750; letter-spacing: .04em; white-space: nowrap; }
    td { padding: 13px 14px; border-top: 1px solid var(--line); color: var(--muted); vertical-align: top; }
    td strong { color: var(--ink); font-weight: 650; }
    td:first-child { color: var(--accent); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .acceptance-list { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; counter-reset: acceptance; }
    .acceptance-card { padding: 19px 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); counter-increment: acceptance; }
    .acceptance-card h3 { display: flex; align-items: baseline; gap: 9px; margin: 0 0 13px; font-size: 14px; }
    .acceptance-card h3::before { content: "AC-0" counter(acceptance); color: var(--accent); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; }
    .acceptance-card dl { display: grid; grid-template-columns: 58px 1fr; gap: 6px 12px; margin: 0; font-size: 13px; line-height: 1.65; }
    .acceptance-card dt { color: var(--faint); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; text-transform: uppercase; }
    .acceptance-card dd { margin: 0; color: var(--muted); }
    .question-list { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
    .question-list li { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: start; padding: 15px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.65; }
    .question-list .q-id { color: var(--accent); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; }
    .question-list p { margin: 0; color: var(--muted); }
    .question-list strong { color: var(--ink); }
    .question-list .q-impact { color: var(--warning); font-size: 11px; white-space: nowrap; }
    .decision-table .selected { background: var(--accent-soft); }
    .decision-table .selected td { border-top-color: var(--accent); border-bottom-color: var(--accent); }
    .decision-table .selected td:first-child { border-left: 3px solid var(--accent); padding-left: 11px; }
    .architecture-figure { margin: 0; overflow-x: auto; padding: 26px 22px 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-2); }
    .diagram-flow { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .diagram-node { flex: 1 1 0; max-width: 120px; min-width: 82px; padding: 13px 8px; border: 1px solid var(--line-strong); border-radius: var(--radius); color: var(--ink); background: var(--surface); font-size: 12px; font-weight: 650; line-height: 1.45; text-align: center; }
    .diagram-node small { display: block; margin-top: 4px; color: var(--faint); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; font-weight: 500; }
    .diagram-node.primary { color: var(--accent-strong); border-color: var(--accent); background: var(--accent-soft); }
    .diagram-arrow { flex: 0 0 auto; color: var(--accent); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 18px; }
    .diagram-svg { display: block; width: 100%; min-width: 720px; height: auto; }
    .diagram-svg .boundary { fill: var(--surface-2); stroke: var(--line); }
    .diagram-svg .node { fill: var(--surface); stroke: var(--line-strong); }
    .diagram-svg .node.primary { fill: var(--accent-soft); stroke: var(--accent); }
    .diagram-svg .edge { fill: none; stroke: var(--accent); stroke-width: 1.5; }
    .diagram-svg .node-label { fill: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; font-size: 14px; }
    .diagram-svg .edge-label { fill: var(--muted); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
    .architecture-figure figcaption { margin-top: 18px; color: var(--faint); font-size: 11px; line-height: 1.6; text-align: center; }
    .diagram-source { margin-top: 14px; color: var(--muted); font-size: 12px; }
    .diagram-source pre { margin-top: 10px; }
    .code-label { margin: 0 0 8px; color: var(--faint); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    pre { max-width: 100%; margin: 0; overflow-x: auto; padding: 20px; border-radius: var(--radius); color: var(--code-fg); background: var(--code-bg); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; line-height: 1.8; tab-size: 2; }
    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    :not(pre) > code { padding: 2px 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--accent-strong); background: var(--accent-soft); font-size: .9em; overflow-wrap: anywhere; }
    pre code { padding: 0; border: 0; color: inherit; background: transparent; font-size: inherit; }
    .test-details { margin-bottom: 12px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .test-details summary { display: grid; grid-template-columns: 50px 1fr auto; gap: 12px; align-items: center; padding: 16px 18px; cursor: pointer; list-style: none; }
    .test-details summary::-webkit-details-marker { display: none; }
    .test-details summary::after { content: "+"; color: var(--accent); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 18px; }
    .test-details[open] summary::after { content: "−"; }
    .test-details summary .test-id { color: var(--accent); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; font-weight: 700; }
    .test-details summary strong { font-size: 13px; font-weight: 650; }
    .test-body { padding: 0 18px 18px 80px; }
    .test-body dl { display: grid; grid-template-columns: 74px 1fr; gap: 9px 14px; margin: 0; padding-top: 15px; border-top: 1px solid var(--line); font-size: 12px; line-height: 1.7; }
    .test-body dt { color: var(--faint); }
    .test-body dd { margin: 0; color: var(--muted); }
    .test-body strong { color: var(--ink); }
    .doc-footer { display: flex; justify-content: space-between; gap: 20px; margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--faint); font-size: 11px; line-height: 1.6; }

    @media (max-width: 1100px) {
      .doc-content { padding-inline: 32px; }
      .diagram-flow { flex-wrap: wrap; }
    }
    @media (max-width: 760px) {
      html { scroll-padding-top: 12px; }
      .document-page { padding: 12px 10px 24px; }
      .doc-window { width: 100%; }
      .doc-layout { grid-template-columns: 1fr; min-height: 0; }
      .doc-sidebar { position: static; max-height: none; overflow: visible; padding: 20px; border-right: 0; border-bottom: 1px solid var(--line); }
      .doc-nav-label { margin: 22px 0 8px; }
      .doc-nav { display: flex; flex-wrap: wrap; gap: 5px; }
      .doc-nav a { padding: 7px 9px; }
      .doc-sidebar-footer { display: none; }
      .doc-content { padding: 24px 20px 32px; }
      .doc-hero { padding: 24px 20px; }
      .doc-hero h1 { font-size: 34px; }
      .summary-strip { grid-template-columns: 1fr; }
      .summary-item { padding: 12px 15px; border-right: 0; border-bottom: 1px solid var(--line); }
      .summary-item:last-child { border-bottom: 0; }
      .two-col, .three-col { grid-template-columns: 1fr; }
      .question-list li { grid-template-columns: 38px 1fr; }
      .question-list .q-impact { grid-column: 2; }
      .test-details summary { grid-template-columns: 42px 1fr auto; padding-inline: 14px; }
      .test-body { padding: 0 14px 16px; }
      .test-body dl { grid-template-columns: 1fr; gap: 3px; }
      .test-body dd { margin-bottom: 8px; }
      .doc-footer { display: block; }
    }
    @media (max-width: 560px) {
      .diagram-flow { flex-direction: column; }
      .diagram-node { width: 100%; max-width: none; }
      .diagram-arrow { transform: rotate(90deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition: none !important; }
    }
    @media print {
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-2: #ffffff;
        --ink: #111111;
        --muted: #444444;
        --faint: #666666;
        --accent: #222222;
        --accent-strong: #111111;
        --accent-soft: #f2f2f2;
        --line: #cccccc;
        --line-strong: #999999;
        --success: #222222;
        --success-soft: #f4f4f4;
        --warning: #222222;
        --warning-soft: #f4f4f4;
        --hero-bg: #ffffff;
        --hero-border: #bbbbbb;
        --table-head: #f2f2f2;
        --code-bg: #f4f4f4;
        --code-fg: #111111;
        --shadow: none;
      }
      body { background: #ffffff; }
      .document-page { min-height: 0; padding: 0; }
      .doc-sidebar { display: none; }
      .doc-window { max-width: none; border: 0; border-radius: 0; box-shadow: none; }
      .doc-layout { display: block; min-height: 0; }
      .doc-content { padding: 0; }
      .doc-section, .info-card, .acceptance-card, .test-details, .architecture-figure { break-inside: avoid; }
      .test-details:not([open]) > *:not(summary) { display: block !important; }
      .test-details summary::after { display: none; }
      a { text-decoration: none; }
      .diagram-svg { min-width: 0; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    }
  </style>
</head>
<body data-document-type="{{DOCUMENT_TYPE}}">
  <article class="document-page">
    <div class="doc-window">
      <div class="doc-layout">
        <aside class="doc-sidebar">
          <a class="doc-brand" href="#document-overview">
            <span class="doc-brand-mark">{{DOC_BRAND_MARK}}</span>
            <span><span class="doc-brand-name">{{DOC_BRAND}}</span><span class="doc-brand-meta">{{DOC_KIND_LABEL}}</span></span>
          </a>
          <p class="doc-nav-label">文档导航</p>
          <nav class="doc-nav" aria-label="文档章节">{{NAV_ITEMS}}</nav>
          <div class="doc-sidebar-footer">{{SIDEBAR_META}}</div>
        </aside>
        <main class="doc-content" id="document-overview">
          <header class="doc-hero">
            <p class="doc-eyebrow">{{HERO_EYEBROW}}</p>
            <h1>{{DOCUMENT_H1}}</h1>
            <p class="doc-subtitle">{{DOCUMENT_SUBTITLE}}</p>
            <div class="doc-meta">{{DOC_BADGES}}</div>
          </header>
          {{SUMMARY_BLOCK}}
          {{LEAD_NOTICE}}
          {{DOCUMENT_SECTIONS}}
          <footer class="doc-footer">{{FOOTER_CONTENT}}</footer>
        </main>
      </div>
    </div>
  </article>
</body>
</html>
